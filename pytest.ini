[pytest]
# tests/ 下所有文件顶层 `import bpy`，只能在真实 Blender 里运行
# （python scripts/run_blender_tests.py --blender <路径>）；
# scripts/ 是各自独立的验证脚本、native/dist 是构建产物。
# 在仓库根误跑 `pytest` 时若不加此配置，收集阶段就会
# ModuleNotFoundError: No module named 'bpy' 直接炸掉。
norecursedirs = tests scripts native dist deliverables .zcode .git .workbuddy-ai .venv venv
